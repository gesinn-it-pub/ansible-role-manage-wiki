#   listen: Restart wiki

# -----------------------------------------------------------------------------

# Ofelia reads the labels of the wiki containers only at its start, see tasks/restart-ofelia.yml.
- name: Restart Wiki | 4/6 (restart ofelia)
  ansible.builtin.include_tasks: ../tasks/restart-ofelia.yml
  listen: Restart wiki

# -----------------------------------------------------------------------------

- name: Restart Wiki | 5/6 (update.php)
  ansible.builtin.shell: |
    set -eux
    {{ docker_compose }} exec wiki php maintenance/update.php --quick
  register: restart_4_result
  args:
    chdir: "{{ WIKI_INSTALLATION_PATH }}"
  environment: "{{ proxy_env }}"
  listen: Restart wiki

# The password reaches the container on stdin. Neither a command line argument nor an environment variable would do:
# both show up in the process list or in the -vvv output of Ansible. The task is censored as well.
- name: Restart Wiki | 6/6 (changePassword.php)
  ansible.builtin.shell: |
    set -eu
    {{ docker_compose }} exec -T wiki sh -c \
      'IFS= read -r password \
      && php maintenance/changePassword.php --user={{ WIKI_WIKISYSOP_USER | quote }} --password="$password"' \
      || true
  args:
    chdir: "{{ WIKI_INSTALLATION_PATH }}"
    stdin: "{{ WIKI_WIKISYSOP_PASSWORD }}"
  environment: "{{ proxy_env }}"
  changed_when: true
  no_log: true
  listen: Restart wiki

