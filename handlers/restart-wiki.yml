- name: Restart Wiki | 1/6 (docker login)
  ansible.builtin.command:
    cmd: docker login ghcr.io -u gesinn-it --password-stdin
    chdir: "{{ WIKI_INSTALLATION_PATH }}"
    stdin: "{{ GH_API_TOKEN }}"
  register: restart_1_result
  changed_when: true
  no_log: true
  environment: "{{ proxy_env }}"
  listen: Restart wiki
  when: GH_API_TOKEN is defined

# - name: Restart wiki 1/4 result
#   ansible.builtin.debug:
#     var: restart_1_result.stdout_lines
#   listen: Restart wiki

# -----------------------------------------------------------------------------

- name: Restart Wiki | 2/6 (build & up)
  ansible.builtin.shell: |
    set -eux
    {{ docker_compose }} --profile=no-up pull
    {{ docker_compose }} build --no-cache --pull wiki
    {{ docker_compose }} up -d --force-recreate
  register: restart_2_result
  args:
    chdir: "{{ WIKI_INSTALLATION_PATH }}"
  environment: "{{ proxy_env }}"
  listen: Restart wiki

# - name: Restart wiki 2/6 result
#   ansible.builtin.debug:
#     var: restart_2_result.stdout_lines
#   listen: Restart wiki

# -----------------------------------------------------------------------------

- name: Restart Wiki | 3/6 (wait-for-wiki)
  ansible.builtin.shell: |
    set -eux
    {{ docker_compose }} run --rm wait-for-wiki
  register: restart_3_result
  args:
    chdir: "{{ WIKI_INSTALLATION_PATH }}"
  environment: "{{ proxy_env }}"
  listen: Restart wiki

# - name: Restart wiki 3/6 result
