- name: Destroy Wiki | Check if the installation folder exists
  ansible.builtin.stat:
    path: "{{ WIKI_INSTALLATION_PATH }}"
  register: destroy_wiki_installation

- name: Destroy Wiki | Docker Compose down
  ansible.builtin.shell: |
    set -eu
    {{ docker_compose }} down --volumes
  args:
    chdir: "{{ WIKI_INSTALLATION_PATH }}"
  when: destroy_wiki_installation.stat.exists

- name: Destroy Wiki | Remove installation folder
  ansible.builtin.file:
    path: "{{ WIKI_INSTALLATION_PATH }}"
    state: absent

- name: Destroy Wiki | Remove mobo deployment folder
  delegate_to: localhost
  ansible.builtin.file:
    path: "{{ local_wiki_folder }}/mobo-deployment"
    state: absent
  become: false

# The containers are gone, so Ofelia would keep failing on their jobs
- name: Destroy Wiki | Restart Ofelia
  ansible.builtin.include_tasks: restart-ofelia.yml
