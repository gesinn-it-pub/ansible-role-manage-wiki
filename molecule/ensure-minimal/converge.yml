---
- name: Converge
  hosts: all
  vars_files:
    - ../shared/vars.yml
  tasks:
    # Stubbed: the docker CLI and update-ca-certificates (molecule/shared/bin).
    # Untested: a real Docker daemon, image builds and the wiki itself.
    # The role is applied the way wiki-factory does: single task files via
    # include_tasks, so defaults/ of the role are not loaded.
    - name: Show info
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/show-info.yml"

    - name: Ensure wiki
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/ensure-wiki.yml"

  handlers:
    - name: Restart wiki
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../handlers/restart-wiki.yml"
