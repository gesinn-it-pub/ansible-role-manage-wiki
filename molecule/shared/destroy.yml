---
# The local driver changes the machine that runs the test, so remove what the
# scenario created. Otherwise the scenarios would depend on the run order.
- name: Destroy
  hosts: all
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Remove files and directories created by the scenario
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ scenario_root }}"
        - "{{ scenario_root }}-ansible.log"
        - /tmp/restart-wiki-trigger
        - /usr/local/share/ca-certificates/LDAP-CA.crt
