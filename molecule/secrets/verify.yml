---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../shared/vars.yml
  tasks:
    - name: Read the docker call log
      ansible.builtin.slurp:
        src: /tmp/molecule-secrets/docker.log
      register: docker_log

    - name: Read the log of the converge run, which ran with -vvv
      ansible.builtin.slurp:
        src: /tmp/molecule-secrets-ansible.log
      register: ansible_log

    - name: Assert the secrets never reach a docker command line
      ansible.builtin.assert:
        that:
          - GH_API_TOKEN not in (docker_log.content | b64decode)
          - WIKI_WIKISYSOP_PASSWORD not in (docker_log.content | b64decode)
        fail_msg: "A secret was passed as a docker argument, where the process list shows it"

    - name: Assert the secrets are not written to the Ansible log
      ansible.builtin.assert:
        that:
          - GH_API_TOKEN not in (ansible_log.content | b64decode)
          - WIKI_WIKISYSOP_PASSWORD not in (ansible_log.content | b64decode)
        fail_msg: "A secret appears in the Ansible output; the task needs no_log"

    - name: Assert the restart still logged in and changed the password
      ansible.builtin.assert:
        that:
          - "'docker-login-stdin length=' in (docker_log.content | b64decode)"
          - "'maintenance/changePassword.php' in (docker_log.content | b64decode)"
