---
driver:
  name: default

platforms:
  - name: instance

provisioner:
  name: ansible
  env:
    # the stubs for docker and update-ca-certificates shadow the real ones
    PATH: ${MOLECULE_SCENARIO_DIRECTORY}/../shared/bin:${PATH}
    FAKE_DOCKER_LOG: /tmp/molecule-${MOLECULE_SCENARIO_NAME}/docker.log
    # -vvv shows what an uncensored task would leak into the log
    ANSIBLE_VERBOSITY: "3"
    ANSIBLE_LOG_PATH: /tmp/molecule-${MOLECULE_SCENARIO_NAME}-ansible.log
  inventory:
    hosts:
      all:
        hosts:
          instance:
            ansible_connection: local
    group_vars:
      all:
        MW_RELEASE: "1.35"
        GH_API_TOKEN: "ghp_secret-token-1f3a"
  playbooks:
    destroy: ../shared/destroy.yml
  options:
    skip-tags: molecule_skip

verifier:
  name: ansible
