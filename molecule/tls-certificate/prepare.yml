---
- name: Prepare
  hosts: all
  gather_facts: false
  vars_files:
    - ../shared/vars.yml
  tasks:
    # Created by the manage_traefik role in production.
    - name: Create the traefik folders
      ansible.builtin.file:
        path: "{{ TRAEFIK_INSTALLATION_PATH }}/etc/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - certs
        - dynamic
